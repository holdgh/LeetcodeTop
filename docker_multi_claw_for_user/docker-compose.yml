# docker-compose.yml
version: '3.8'

services:
  copaw-nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - copaw-manager
    restart: unless-stopped

  copaw-manager:
    build:
      context: ./manager
      dockerfile: Dockerfile
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./backups:/backup
      - ./logs:/app/logs
    environment:
      - DOCKER_HOST=unix:///var/run/docker.sock
      - LOG_LEVEL=info
      - BACKUP_DIR=/backup
    ports:
      - "8080:8080"
    restart: unless-stopped

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  postgres:
    image: postgres:13
    environment:
      - POSTGRES_DB=osclaw_manager
      - POSTGRES_USER=copaw
      - POSTGRES_PASSWORD=copaw_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped

volumes:
  redis_data:
  postgres_data: