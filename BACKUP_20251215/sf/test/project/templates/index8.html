<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <title>增材质检问答助手</title>
  <style>
    body {
      margin: 0;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f1f2f5;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    header {
      background-color: #4a90e2;
      color: white;
      padding: 16px;
      text-align: center;
      font-size: 24px;
    }
    main {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
    }
    .chat-container {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .message {
      max-width: 80%;
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 16px;
      line-height: 1.5;
      white-space: pre-wrap;
    }
    .user {
      align-self: flex-end;
      background-color: #d1e7dd;
    }
    .assistant {
      align-self: flex-start;
      background-color: #ffffff;
      border: 1px solid #ccc;
    }
    .image-pair {
      display: flex;
      flex-direction: row;
      gap: 20px;
      margin-top: 10px;
    }
    .image-pair img {
      max-width: 240px;
      border-radius: 8px;
      border: 1px solid #ddd;
    }
    .image-label {
      text-align: center;
      font-size: 14px;
      margin-top: 4px;
    }
    form {
      display: flex;
      flex-direction: column;
      padding: 16px;
      border-top: 1px solid #ccc;
      background: white;
    }
    .input-group {
      display: flex;
      gap: 10px;
      margin-bottom: 10px;
    }
    input[type="file"],
    input[type="text"] {
      flex: 1;
      padding: 10px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }
    button {
      padding: 10px 20px;
      font-size: 16px;
      background-color: #4a90e2;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    button:hover {
      background-color: #3a78c2;
    }
  </style>
</head>
<body>
  <header>“灵镜”多模态质检大模型智能引擎</header>
  <main>
    <div class="chat-container" id="chatBox"></div>
  </main>

  <form id="uploadForm">
    <div class="input-group">
      <input type="file" id="fileInput" name="image" required />
    </div>
    <div class="input-group">
      <input type="text" id="questionInput" name="question" placeholder="请输入您的问题..." required />
      <button type="submit">发送</button>
    </div>
  </form>

  <script>
    const form = document.getElementById("uploadForm");
    const chatBox = document.getElementById("chatBox");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      const fileInput = document.getElementById("fileInput");
      const questionInput = document.getElementById("questionInput");
      const formData = new FormData();
      const file = fileInput.files[0];
      const question = questionInput.value;

      formData.append("image", file);
      formData.append("question", question);

      // 用户问题
      const userMessage = document.createElement("div");
      userMessage.classList.add("message", "user");
      userMessage.innerText = question;
      chatBox.appendChild(userMessage);

      questionInput.value = "";
      userMessage.scrollIntoView({ behavior: "smooth" }); // 自动滚动到用户消息

      try {
        const res = await fetch("/analyze/", {
          method: "POST",
          body: formData
        });

        const result = await res.json();

        const assistantMessage = document.createElement("div");
        assistantMessage.classList.add("message", "assistant");

        // 文本回答
        assistantMessage.innerText = result.answer;

        // 图像展示容器
        const imagePair = document.createElement("div");
        imagePair.classList.add("image-pair");

        // 原图部分
        if (result.intent==="defect") {
        const originalContainer = document.createElement("div");
        const originalImg = document.createElement("img");
        originalImg.src = result.original_image_url + "?t=" + new Date().getTime();
        originalImg.alt = "原图";
        const originalLabel = document.createElement("div");
        originalLabel.innerText = "原图";
        originalLabel.classList.add("image-label");
        originalContainer.appendChild(originalImg);
        originalContainer.appendChild(originalLabel);
        imagePair.appendChild(originalContainer);
    }
        // 检测图部分（如果 yolo_empty 为 false）
        if (result.yolo_empty === false && result.yolo_output_image_url) {
          const yoloContainer = document.createElement("div");
          const yoloImg = document.createElement("img");
          yoloImg.src = result.yolo_output_image_url + "?t=" + new Date().getTime();
          yoloImg.alt = "检测图";
          const yoloLabel = document.createElement("div");
          yoloLabel.innerText = "检测图";
          yoloLabel.classList.add("image-label");
          yoloContainer.appendChild(yoloImg);
          yoloContainer.appendChild(yoloLabel);
          imagePair.appendChild(yoloContainer);
        }

        assistantMessage.appendChild(imagePair);
        chatBox.appendChild(assistantMessage);

        assistantMessage.scrollIntoView({ behavior: "smooth" }); // 自动滚动到最新回答

      } catch (err) {
        alert("出错了: " + err.message);
      }
    });
  </script>
</body>
</html>
